name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main  # Automatically triggers when you push to main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build

      - name: Deploy Static Assets to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build     # The folder React generates when building
          branch: gh-pages  # The clean branch GitHub Pages hosts from
