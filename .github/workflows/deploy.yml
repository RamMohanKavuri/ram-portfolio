name: Deploy Portfolio to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key || echo "base64 decode failed"
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 3.69.232.142 >> ~/.ssh/known_hosts || echo "ssh-keyscan failed"
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 ec2-user@3.69.232.142 "echo connected successfully"

      - name: Build Docker Image
        run: docker build -t ram-portfolio .

      - name: Save Docker Image
        run: docker save ram-portfolio | gzip > ram-portfolio.tar.gz

      - name: Copy Image to EC2
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ram-portfolio.tar.gz ec2-user@3.69.232.142:/home/ec2-user/

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ec2-user@3.69.232.142 << 'ENDSSH'
            docker load < /home/ec2-user/ram-portfolio.tar.gz
            docker stop portfolio || true
            docker rm portfolio || true
            docker run -d --name portfolio -p 80:80 ram-portfolio
            echo "Portfolio deployed successfully!"
          ENDSSH