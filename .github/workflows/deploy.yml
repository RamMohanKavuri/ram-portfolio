name: Deploy Portfolio to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Build Docker Image
        run: docker build -t ram-portfolio .

      - name: Save Docker Image
        run: docker save ram-portfolio | gzip > ram-portfolio.tar.gz

      - name: Copy Image to EC2
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ram-portfolio.tar.gz ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/home/ec2-user/

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << 'ENDSSH'
            docker load < /home/ec2-user/ram-portfolio.tar.gz
            docker stop portfolio || true
            docker rm portfolio || true
            docker run -d --name portfolio -p 80:80 ram-portfolio
            echo "Portfolio deployed successfully!"
          ENDSSH