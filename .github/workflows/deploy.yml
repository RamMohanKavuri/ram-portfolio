name: Deploy Portfolio to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.AWS_SSH_KEY }}

      - name: Add EC2 to Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Build Docker Image
        run: docker build -t ram-portfolio .

      - name: Save Docker Image
        run: docker save ram-portfolio | gzip > ram-portfolio.tar.gz

      - name: Copy Image to EC2
        run: |
          scp ram-portfolio.tar.gz ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/home/ec2-user/

      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << 'ENDSSH'
            docker load < /home/ec2-user/ram-portfolio.tar.gz
            docker stop portfolio || true
            docker rm portfolio || true
            docker run -d --name portfolio -p 80:80 ram-portfolio
            echo "Portfolio deployed successfully!"
          ENDSSH
